<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality Unbound - Life Simulator Prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background-color: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #e0e0e0;
      z-index: 100;
    }
    .panel {
      background: rgba(30, 30, 50, 0.85);
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 10px;
      backdrop-filter: blur(10px);
    }
    .panel h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff6b6b;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid #444;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0;
    }
    .stat-label {
      font-size: 12px;
      color: #aaa;
    }
    .stat-bar {
      flex: 1;
      height: 8px;
      background: #333;
      margin-left: 10px;
      border-radius: 4px;
      overflow: hidden;
    }
    .stat-progress {
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ff8c42);
      transition: width 0.1s;
    }
    .stat-value {
      min-width: 40px;
      font-size: 12px;
      color: #fff;
      font-family: monospace;
    }
    #instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #666;
      font-size: 13px;
    }
    #helpBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      z-index: 100;
      transition: opacity 0.2s;
    }
    #helpBtn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="panel">
      <h3>Player Status</h3>
      <div class="stat-row">
        <span class="stat-label">Hunger</span>
        <span class="stat-value" id="hungerVal">50</span>
      </div>
      <div class="stat-bar"><div class="stat-progress" id="hungerBar" style="width: 50%"></div></div>
      <div class="stat-row">
        <span class="stat-label">Energy</span>
        <span class="stat-value" id="energyVal">100</span>
      </div>
      <div class="stat-bar"><div class="stat-progress" id="energyBar" style="width: 100%"></div></div>
      <div class="stat-row">
        <span class="stat-label">Health</span>
        <span class="stat-value" id="healthVal">100</span>
      </div>
      <div class="stat-bar"><div class="stat-progress" id="healthBar" style="width: 100%"></div></div>
      <div class="stat-row">
        <span class="stat-label">Money</span>
        <span class="stat-value" id="moneyVal">1000</span>
      </div>
    </div>
    
    <div class="panel">
      <h3>Time</h3>
      <div class="stat-row">
        <span class="stat-label">Game Time</span>
        <span class="stat-value" id="gameTime">6:00 AM</span>
      </div>
    </div>
  </div>

  <button id="helpBtn">Toggle Help</button>
  <div id="instructions">
    W/A/S/D: Move | Space: Jump | Left click: Interact | F1: Toggle help
  </div>

  <script type="module">
    import * as THREE from 'three';
    import Stats from 'three/examples/jsm/libs/stats.module.js';
    import GUI from 'three/examples/jsm/libs/lil-gui.module.min.js';
    
    // Check environment
    const isBrowser = typeof window !== 'undefined' && typeof document !== 'undefined';
    const isNode = !isBrowser;
    
    // Configuration
    const CONFIG = {
      worldSize: 500,
      dayNightCycle: true,
      timeScale: 60,
      maxNPCs: 50,
      simulationPaused: false,
    };
    
    // Only run in browser
    if (isNode) {
      console.log('Reality Unbound: This game is designed for browser play. Opening minimal info.');
      console.log('Run with: npx serve or open index.html in a browser');
      document.write('<p>Reality Unbound - Best played in a browser. See package.json for dev servers.</p>');
      document.write('<p><a href="https://threejs.org/">Three.js</a> based life simulator prototype.</p>');
      exit();
    }
    
    // ---- Scene Setup ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(1.6, 1.6, 1.6);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    
    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = false;
    
    // ---- Ground & World ----
    const groundGeometry = new THREE.PlaneGeometry(CONFIG.worldSize, CONFIG.worldSize);
    const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    
    const gridHelper = new THREE.GridHelper(CONFIG.worldSize, 50, 0x444444, 0x222222);
    scene.add(gridHelper);
    
    // ---- Buildings ----
    function createBuilding(position, height, width, depth) {
      const geometry = new THREE.BoxGeometry(width, height, depth);
      const material = new THREE.MeshStandardMaterial({
        color: Math.random() > 0.5 ? 0x6B8E23 : 0x8B4513,
        roughness: 0.6,
      });
      const building = new THREE.Mesh(geometry, material);
      building.position.copy(position);
      building.position.y = height / 2;
      building.castShadow = true;
      building.receiveShadow = true;
      return building;
    }
    
    const buildings = [];
    for (let i = 0; i < 30; i++) {
      const x = (Math.random() - 0.5) * (CONFIG.worldSize - 20);
      const z = (Math.random() - 0.5) * (CONFIG.worldSize - 20);
      const height = 5 + Math.random() * 15;
      const width = 5 + Math.random() * 10;
      const depth = 5 + Math.random() * 10;
      const building = createBuilding(new THREE.Vector3(x, 0, z), height, width, depth);
      scene.add(building);
      buildings.push(building);
    }
    
    // ---- Lighting ----
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(100, 200, 100);
    sunLight.castShadow = true;
    scene.add(sunLight);
    
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(50, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffe066 })
    );
    sun.position.set(100, 200, 100);
    scene.add(sun);
    
    // ---- Player System ----
    class Player {
      constructor() {
        this.health = 100;
        this.hunger = 50;
        this.energy = 100;
        this.money = 1000;
        this.inventory = [];
        this.emotion = 'neutral';
        this.timeInGame = 0;
        this.currentLocation = new THREE.Vector3(0, 0, 0);
        this.moveForward = false;
        this.moveBackward = false;
        this.moveLeft = false;
        this.moveRight = false;
        this.canJump = true;
        this.jumpVelocity = 0;
        this.isOnGround = true;
        
        // Input
        window.addEventListener('keydown', (event) => {
          switch (event.code) {
            case 'KeyW': this.moveForward = true; break;
            case 'KeyS': this.moveBackward = true; break;
            case 'KeyA': this.moveLeft = true; break;
            case 'KeyD': this.moveRight = true; break;
            case 'Space': if (this.isOnGround) { this.jumpVelocity = 5; this.isOnGround = false; } break;
          }
        });
        
        window.addEventListener('keyup', (event) => {
          switch (event.code) {
            case 'KeyW': this.moveForward = false; break;
            case 'KeyS': this.moveBackward = false; break;
            case 'KeyA': this.moveLeft = false; break;
            case 'KeyD': this.moveRight = false; break;
          }
        });
      }
      
      update(deltaTime) {
        this.timeInGame += deltaTime;
        this.hunger = Math.max(0, this.hunger - deltaTime * 0.02);
        this.energy = Math.max(0, this.energy - deltaTime * 0.01);
        this.health = Math.max(0, this.health - deltaTime * 0.005);
        
        if (this.hunger < 20) this.emotion = 'sad';
        else if (this.hunger < 40) this.emotion = 'neutral';
        else this.emotion = 'happy';
        
        // Movement
        const speed = 4.0;
        const velocity = new THREE.Vector3();
        if (this.moveForward) velocity.z -= speed;
        if (this.moveBackward) velocity.z += speed;
        if (this.moveLeft) velocity.x -= speed;
        if (this.moveRight) velocity.x += speed;
        velocity.applyEuler(new THREE.Euler(0, camera.rotation.y, 0, 'YXZ'));
        camera.position.addScaledVector(velocity, deltaTime);
        camera.rotation.x = 0;
        
        if (camera.position.y < 2) {
          camera.position.y = 2;
          this.isOnGround = true;
          this.canJump = true;
        } else {
          this.isOnGround = false;
        }
        this.currentLocation.copy(camera.position);
      }
    }
    
    const player = new Player();
    
    // ---- NPC System ----
    class NPC {
      constructor(id) {
        this.id = id;
        this.name = `NPC_${id}`;
        this.age = Math.floor(Math.random() * 60) + 18;
        this.health = 100;
        this.hunger = 50;
        this.energy = 100;
        this.money = Math.random() * 1000;
        this.location = new THREE.Vector3(
          (Math.random() - 0.5) * 100,
          0,
          (Math.random() - 0.5) * 100
        );
        this.job = ['unemployed', 'worker', 'doctor', 'engineer', 'teacher'][Math.floor(Math.random() * 5)];
        this.relationships = {};
        this.home = null;
        this.inventory = [];
        this.memories = [];
        this.emotion = 'neutral';
        this.personality = Math.random();
        
        const geometry = new THREE.SphereGeometry(0.3, 16, 16);
        const material = new THREE.MeshBasicMaterial({
          color: this.getColorForEmotion(this.emotion),
        });
        this.mesh = new THREE.Mesh(geometry, material);
        this.mesh.position.copy(this.location);
        this.mesh.visible = true;
        scene.add(this.mesh);
      }
      
      getColorForEmotion(emotion) {
        const colors = { happy: 0xff6b6b, sad: 0x4ecdc4, angry: 0xffa502, neutral: 0x90a4ae, anxious: 0xf09321 };
        return colors[emotion] || colors.neutral;
      }
      
      update(deltaTime) {
        if (CONFIG.simulationPaused) return;
        this.hunger = Math.max(0, this.hunger - deltaTime * 0.01);
        this.energy = Math.max(0, this.energy - deltaTime * 0.005);
        if (this.hunger < 20) this.health = Math.max(0, this.health - deltaTime * 0.1);
        if (this.energy < 20) this.health = Math.max(0, this.health - deltaTime * 0.05);
        if (this.hunger < 10) this.emotion = 'angry';
        else if (this.hunger < 30) this.emotion = 'sad';
        else if (this.energy > 80) this.emotion = 'happy';
        else this.emotion = 'neutral';
        if (this.mesh) {
          this.mesh.position.copy(this.location);
          this.mesh.material.color.set(this.getColorForEmotion(this.emotion));
        }
        this.behave(deltaTime);
      }
      
      behave(deltaTime) {
        if (Math.random() > 0.98) {
          this.location.x += (Math.random() - 0.5) * 10;
          this.location.z += (Math.random() - 0.5) * 10;
          this.location.y = Math.max(0, this.location.y);
        }
      }
    }
    
    let npcs = [];
    for (let i = 0; i < CONFIG.maxNPCs; i++) {
      npcs.push(new NPC(i));
    }
    
    // ---- Raycast Interaction ----
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    window.addEventListener('pointerdown', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      
      // Buildings
      const buildingIntersects = raycaster.intersectObjects(buildings);
      if (buildingIntersects.length > 0) {
        const intersect = buildingIntersects[0];
        console.log(`Interact with building at (${intersect.point.x.toFixed(1)}, ${intersect.point.y.toFixed(1)}, ${intersect.point.z.toFixed(1)})`);
      }
      
      // NPCs
      for (const npc of npcs) {
        const intersect = raycaster.intersectObject(npc.mesh);
        if (intersect.length > 0) {
          console.log(`Talk to ${npc.name} (${npc.job}, hunger: ${npc.hunger.toFixed(1)}, emotion: ${npc.emotion})`);
          npc.hunger = Math.min(100, npc.hunger + 10);
          npc.emotion = 'happy';
          if (npc.mesh.material) {
            npc.mesh.material.color.set(npc.getColorForEmotion(npc.emotion));
          }
        }
      }
    });
    
    // ---- Day/Night Cycle ----
    let gameTime = 6;
    
    function updateDayNight(deltaTime) {
      if (!CONFIG.dayNightCycle) return;
      gameTime += deltaTime * CONFIG.timeScale;
      if (gameTime >= 24) gameTime = 0;
      
      const angle = (gameTime / 24) * Math.PI * 2;
      const sunHeight = Math.sin(angle) * 100 + 50;
      const sunX = Math.cos(angle) * 150;
      const sunZ = Math.sin(angle) * 150;
      sun.position.set(sunX, sunHeight, sunZ);
      sunLight.position.set(sunX, sunHeight + 50, sunZ);
      
      const hour = gameTime % 24;
      let lightIntensity = 0.6;
      if (hour >= 6 && hour <= 18) { lightIntensity = 0.8; sunLight.intensity = 0.8; }
      else if (hour >= 18 && hour <= 22) { lightIntensity = 0.5; sunLight.intensity = 0.5; }
      else { lightIntensity = 0.2; sunLight.intensity = 0.3; }
      ambientLight.intensity = lightIntensity;
      renderer.shadowMap.enabled = hour >= 6 && hour <= 18;
    }
    
    // ---- Render Loop ----
    const clock = new THREE.Clock();
    
    function animate() {
      requestAnimationFrame(animate);
      const deltaTime = Math.min(clock.getDelta(), 0.1);
      
      player.update(deltaTime);
      npcs.forEach(npc => npc.update(deltaTime));
      updateDayNight(deltaTime);
      
      buildings.forEach((building, i) => {
        building.rotation.y = deltaTime * 0.1 * (i % 2 === 0 ? 1 : -1);
        building.rotation.x = deltaTime * 0.02;
      });
      
      controls.update();
      renderer.render(scene, camera);
    }
    
    animate();
    
    // ---- Resize ----
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
