<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function RNG(seed){this.s=seed>>>0;this.next=()=>{this.s=(this.s*1664525+1013904223)>>>0;return this.s/4294967296};this.int=(a,b)=>a+Math.floor(this.next()*(b-a+1));this.pick=a=>a[Math.floor(this.next()*a.length)]}
const names=['Mira','Tomas','Neri','Asha','Oren','Lio','Sena','Bram','Iven','Kest','Runa','Edda','Corin','Vale','Tavi','Suri','Ansel','Pella','Jori','Nima','Rell','Eska','Daro','Lune','Hale','Maren','Ilya','Ossa','Perrin','Yara'];
const surnames=['Moss','Thorn','Reed','Bell','Ash','Vale','Brook','Pine','Wren','Hearth','Fern','Stone'];
const jobs=['forager','farmer','builder','herbalist','hunter','weaver','trader','carpenter','shepherd','healer','miller','scout'];
const seasons=['SPRING','SUMMER','AUTUMN','WINTER'];
const worldNames=['The Bracken Reach','Morrowfen','The Amber March','Sablewater','The Quiet Vale','Elderwake'];
const tileColors={ocean:'#284957',deep:'#203d49',beach:'#bdac7b',grass:'#6f8b58',forest:'#426849',jungle:'#3c6952',mountain:'#777e73',snow:'#bcc4b9',desert:'#b89963',marsh:'#637e69',village:'#bd9e68',road:'#927c57',river:'#4f9aab'};
let G;
function makeWorld(seed){const r=new RNG(seed),w=64,h=48,tiles=[];let cx=32+r.int(-7,7),cy=24+r.int(-5,5);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let nx=(x-cx)/(w*.47),ny=(y-cy)/(h*.48),island=1-(nx*nx+ny*ny);let n=Math.sin(x*.31+seed*.0001)*.10+Math.cos(y*.25-seed*.0002)*.10+Math.sin((x+y)*.16)*.08+(r.next()-.5)*.24;let elev=island+n;let t=elev<-.17?'ocean':elev<-.08?'deep':elev<-.015?'beach':elev>.55?'mountain':'grass';let rain=Math.sin(y*.19+seed)*.35+Math.cos(x*.17)*.25+r.next()*.45;let temp=1-Math.abs(y-h/2)/(h*.65)+Math.sin(x*.14)*.16;if(t==='grass'){if(temp<.25)t='snow';else if(temp<.4&&rain<.45)t='mountain';else if(rain<.28)t='desert';else if(rain>.72)t=temp>.65?'jungle':'forest';else if(rain>.6)t='marsh'}tiles.push({x,y,t,food:Math.round((rain+(t==='forest'?.28:0))*5),resource:r.pick(['wood','stone','herbs','fiber','clay'])})}
 // winding river and cultivated settlement basin
 let rx=0;for(let y=3;y<h-3;y++){rx=clamp(rx+Math.sin(y*.22+seed)*.8+r.next()*1.8-0.9,10,w-10);let q=tiles[y*w+Math.round(rx)];if(q.t!=='ocean'&&q.t!=='deep')q.t='river'}
 let sx=clamp(cx+r.int(-10,10),14,w-14),sy=clamp(cy+r.int(-8,8),12,h-12);for(let dy=-2;dy<=2;dy++)for(let dx=-3;dx<=3;dx++){let t=tiles[(sy+dy)*w+sx+dx];if(t&&['grass','marsh','forest'].includes(t.t))t.t=(Math.abs(dx)<2&&Math.abs(dy)<2)?'village':'road'}
 const people=[];let id=1;for(let i=0;i<42;i++){let p={id:id++,name:`${r.pick(names)} ${r.pick(surnames)}`,age:r.int(16,68),job:r.pick(jobs),traits:r.pick([['curious','patient'],['bold','restless'],['kind','observant'],['ambitious','stubborn'],['wary','resourceful'],['creative','sociable']]),health:r.int(58,100),happiness:r.int(35,90),wealth:r.int(3,45),x:clamp(sx+r.int(-8,8),0,w-1),y:clamp(sy+r.int(-7,7),0,h-1),family:[],memory:r.pick(['A long winter taught them thrift.','They remember the river flood.','A stranger once shared their last meal.','Their mother taught them to read the clouds.','They dream of seeing the coast.']),alive:true,home:'Hearthmere'};people.push(p)}
 for(let i=0;i<people.length;i++){if(i>0&&i%5===0){people[i].family.push(people[i-1].id);people[i-1].family.push(people[i].id)}}
 const player={name:'Rowan Vale',age:24,health:92,hunger:22,thirst:18,stamina:88,happiness:72,wealth:12,food:3,wood:1,herbs:1,day:1,x:sx+2,y:sy+2,action:'Explore',reputation:0,inventory:{}};
 return {seed,w,h,tiles,people,player,day:1,season:0,year:1,worldName:r.pick(worldNames),settlement:{name:'Hearthmere',population:42,food:184,wood:76,stone:41,prosperity:63,stability:76,health:72,knowledge:12,buildings:8,fields:4,market:14,government:'Village council'},events:[],zoom:1,cam:{x:0,y:0},view:'world',panel:'chronicle',selected:null,paused:false,speed:1,eco:{forest:71,wildlife:66,water:82,soil:75},weather:'Mild skies',offlineAt:Date.now(),won:false};
}
function addEvent(text,type='normal'){G.events.unshift({day:G.day,text,type});G.events=G.events.slice(0,40)}
function save(){try{G.offlineAt=Date.now();localStorage.setItem('livingWorldSave',JSON.stringify(G));toast('World saved to this device')}catch(e){toast('Could not save this world')}}
function load(){try{let s=localStorage.getItem('livingWorldSave');if(s){G=JSON.parse(s);return true}}catch(e){}return false}
function newGame(){const seed=Math.floor(Math.random()*999999)+1;G=makeWorld(seed);addEvent('The first spring of Hearthmere begins beside the old river.','important');addEvent(`${G.settlement.population} people call this valley home.`);addEvent(`${G.people[0].name} starts work as a ${G.people[0].job}.`);G.player.x+=2;G.player.y+=1;G.offlineAt=Date.now();renderAll()}
function aliveCount(){return G.people.filter(p=>p.alive).length}
function dailyTick(){G.day++;G.player.hunger=clamp(G.player.hunger+12,0,100);G.player.thirst=clamp(G.player.thirst+16,0,100);G.player.stamina=clamp(G.player.stamina-6,0,100);G.player.happiness=clamp(G.player.happiness+(G.player.hunger>75?-4:0)+(G.player.health>70?1:0),0,100);let s=G.settlement, season=Math.floor((G.day-1)/24)%4;G.season=season;G.year=1+Math.floor((G.day-1)/96);s.food=Math.max(0,s.food+Math.round(s.fields*(G.eco.soil/100)*2)-Math.ceil(s.population*.16));s.wood=Math.max(0,s.wood+(season===2?3:1)-Math.floor(s.population/80));s.prosperity=clamp(s.prosperity+(s.food>s.population*2?1:-1),0,100);s.stability=clamp(s.stability+(s.food<s.population? -3:1)+(s.prosperity<25?-2:0),0,100);
 for(const p of G.people){if(!p.alive)continue;p.age+=1/365;p.health=clamp(p.health+(s.food<15?-1.4:.12)+(G.weather==='Drought'&&p.job==='farmer'?-1:0),0,100);p.happiness=clamp(p.happiness+(s.food<s.population?-3:((p.job==='farmer'&&season===1)?2:0))+(p.wealth>15?1:0),0,100);p.wealth=clamp(p.wealth+(p.job==='trader'?2:1)-1,0,999);if(p.health<=0||p.age>80&&Math.random()<.03){p.alive=false;addEvent(`${p.name} died at age ${Math.floor(p.age)}. The village remembers.`, 'danger');s.population=Math.max(1,s.population-1)}}
 if(G.day%3===0){let candidates=G.people.filter(p=>p.alive&&p.age>18&&p.age<38);if(candidates.length>1&&s.food>35&&Math.random()<.045){let child={id:Math.max(...G.people.map(p=>p.id))+1,name:`${names[Math.floor(Math.random()*names.length)]} ${candidates[0].name.split(' ').pop()}`,age:0,job:'apprentice',traits:[...candidates[0].traits],health:100,happiness:75,wealth:0,x:candidates[0].x,y:candidates[0].y,family:[candidates[0].id],memory:'Born in a year of plenty.',alive:true,home:s.name};G.people.push(child);candidates[0].family.push(child.id);s.population++;s.food-=8;addEvent(`${child.name} is born to the ${child.home} community.`,'important')}}
 if(G.day%7===0){let chance=Math.random();if(chance<.12){G.weather='Drought';G.eco.soil=clamp(G.eco.soil-5,10,100);G.eco.water=clamp(G.eco.water-9,8,100);s.fields=Math.max(1,s.fields-1);addEvent('A dry wind settles over the valley. The harvest falters; food stores begin to thin.','danger')}else if(chance<.2){G.weather='Gentle rain';G.eco.water=clamp(G.eco.water+4,0,100);s.fields++;addEvent('Rain returns. Garden plots flourish along the river.','important')}else G.weather='Mild skies';
 if(s.food<14){s.prosperity=clamp(s.prosperity-5,0,100);s.stability=clamp(s.stability-4,0,100);G.people.filter(p=>p.alive).forEach(p=>p.happiness=clamp(p.happiness-3,0,100));if(Math.random()<.45)addEvent(`Food scarcity raises market prices in ${s.name}; anxious families consider leaving.`,'danger')}
 if(s.stability<35&&Math.random()<.35){s.government='Emergency council';s.stability=clamp(s.stability+12,0,100);addEvent('A crowded assembly demands a new grain-sharing law. The council yields after a tense debate.','important')}
 if(s.food>90&&s.population>45&&Math.random()<.4){s.buildings++;s.fields++;s.food-=12;addEvent(`Neighbors raise a new granary and open fields beyond ${s.name}.`,'important')}
 if(G.eco.forest<30&&Math.random()<.22)addEvent('With nearby timber scarce, builders travel farther into the old forest.');
 }
 if(G.day%96===0){addEvent(`Another year turns. The ${seasons[season]} rains have passed.`,'important');if(G.year%4===0){s.knowledge++;addEvent(`Shared craft knowledge deepens: ${s.name} now knows ${s.knowledge} useful techniques.`)}}
 if(G.player.hunger>90||G.player.thirst>92){G.player.health=clamp(G.player.health-5,0,100);if(G.player.health<=0){addEvent('You collapse from neglect. A neighbor brings you to the village healer.','danger');G.player.health=35;G.player.x=G.people[0].x;G.player.y=G.people[0].y}}
 updateDate();renderAll()}
function advance(days=1){for(let i=0;i<days;i++)dailyTick()}
function updateDate(){$('#dateChip').textContent=`${seasons[Math.floor((G.day-1)/24)%4]} · YEAR ${1+Math.floor((G.day-1)/96)}`}
let cvs=$('#worldCanvas'),ctx=cvs.getContext('2d'),cell=30,drag=null,lastMove=0;
function resizeCanvas(){let b=cvs.getBoundingClientRect(),d=window.devicePixelRatio||1;cvs.width=Math.round(b.width*d);cvs.height=Math.round(b.height*d);ctx.setTransform(d,0,0,d,0,0);if(!G.cam.initialized){let w=b.width,h=b.height;G.cam.x=G.player.x*cell-w/2;G.cam.y=G.player.y*cell-h/2;G.cam.initialized=true}drawWorld()}
function drawWorld(){if(!G||!ctx)return;let b=cvs.getBoundingClientRect(),w=b.width,h=b.height;if(!w||!h)return;ctx.clearRect(0,0,w,h);cell=clamp(28*G.zoom,14,54);let ox=G.cam.x,oy=G.cam.y;ctx.fillStyle='#182a30';ctx.fillRect(0,0,w,h);let x0=Math.max(0,Math.floor(ox/cell)),y0=Math.max(0,Math.floor(oy/cell)),x1=Math.min(G.w,Math.ceil((ox+w)/cell)),y1=Math.min(G.h,Math.ceil((oy+h)/cell));
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let t=G.tiles[y*G.w+x].t,px=x*cell-ox,py=y*cell-oy;ctx.fillStyle=tileColors[t]||'#65835a';ctx.fillRect(px,py,cell+.6,cell+.6);let v=(x*17+y*31+G.seed)%13;if(['forest','jungle','marsh'].includes(t)){ctx.fillStyle=t==='jungle'?'#345944':'#527451';ctx.beginPath();ctx.arc(px+cell*(.25+(v%3)*.2),py+cell*.55,cell*.17,0,7);ctx.fill();ctx.beginPath();ctx.arc(px+cell*.68,py+cell*.32,cell*.13,0,7);ctx.fill()}else if(t==='mountain'||t==='snow'){ctx.fillStyle=t==='snow'?'#d6ddd1':'#a3a99b';ctx.beginPath();ctx.moveTo(px+cell*.18,py+cell*.82);ctx.lineTo(px+cell*.5,py+cell*.17);ctx.lineTo(px+cell*.84,py+cell*.82);ctx.fill();ctx.fillStyle=t==='snow'?'#eef0e8':'#737c71';ctx.beginPath();ctx.moveTo(px+cell*.5,py+cell*.17);ctx.lineTo(px+cell*.61,py+cell*.57);ctx.lineTo(px+cell*.43,py+cell*.52);ctx.fill()}else if(t==='village'){ctx.fillStyle='#e2c992';ctx.fillRect(px+cell*.25,py+cell*.28,cell*.48,cell*.47);ctx.fillStyle='#78563a';ctx.beginPath();ctx.moveTo(px+cell*.17,py+cell*.34);ctx.lineTo(px+cell*.49,py+cell*.08);ctx.lineTo(px+cell*.81,py+cell*.34);ctx.fill()}else if(t==='road'){ctx.fillStyle='#ad9569';ctx.fillRect(px,py+cell*.39,cell,cell*.22)}else if(t==='river'){ctx.fillStyle='#78bdc5';ctx.fillRect(px+cell*.25,py,cell*.38,cell)}}
 // ambient animals and settlement markers
 let seedr=new RNG(G.seed+G.day);for(let i=0;i<20;i++){let x=seedr.int(0,G.w-1),y=seedr.int(0,G.h-1),t=G.tiles[y*G.w+x].t;if(['forest','grass','marsh'].includes(t)){let px=x*cell-ox,py=y*cell-oy;if(px>-cell&&py>-cell&&px<w&&py<h){ctx.fillStyle='#d38b68';ctx.beginPath();ctx.arc(px+cell/2,py+cell/2,Math.max(2,cell*.09),0,7);ctx.fill()}}}
 for(let p of G.people){if(!p.alive)continue;let px=p.x*cell-ox+cell/2,py=p.y*cell-oy+cell/2;if(px<0||py<0||px>w||py>h)continue;ctx.fillStyle=p.id===G.selected?'#e7c879':'#e5e3c9';ctx.beginPath();ctx.arc(px,py,p.id===G.selected?cell*.22:cell*.14,0,7);ctx.fill();if(cell>25){ctx.fillStyle='#182119';ctx.beginPath();ctx.arc(px,py,cell*.05,0,7);ctx.fill()}}
 let px=G.player.x*cell-ox+cell/2,py=G.player.y*cell-oy+cell/2;ctx.fillStyle='#f4bf62';ctx.beginPath();ctx.arc(px,py,cell*.3,0,7);ctx.fill();ctx.strokeStyle='#fff0c4';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#3e3220';ctx.beginPath();ctx.arc(px,py,cell*.1,0,7);ctx.fill();
}
function bar(label,value,color=''){return `<div class="stat-row"><span>${label}</span><strong>${Math.round(value)}%</strong></div><div class="meter ${color}"><i style="width:${clamp(value,0,100)}%"></i></div>`}
function renderPlayer(){let p=G.player,worldTile=G.tiles[p.y*G.w+p.x];$('#playerTitle').textContent=p.name;$('#playerPanel').innerHTML=`<div class="section"><div class="person-card"><div class="person-name">${p.name}, ${p.age}</div><div class="person-sub">Wanderer · ${G.settlement.name} outskirts</div><div class="traits"><span class="trait">Known face</span><span class="trait">${p.reputation>4?'Local favorite':'New arrival'}</span></div></div></div><div class="section"><div class="section-title">Needs & wellbeing</div>${bar('Health',p.health,p.health<35?'danger':'')}${bar('Stamina',p.stamina)}${bar('Hunger',100-p.hunger,p.hunger>65?'warn':'')}${bar('Thirst',100-p.thirst,p.thirst>65?'warn':'')}${bar('Contentment',p.happiness)}</div><div class="section"><div class="section-title">Satchel</div><div class="resources"><div class="resource"><span>Food</span><strong>◈ ${p.food}</strong></div><div class="resource"><span>Wood</span><strong>♣ ${p.wood}</strong></div><div class="resource"><span>Herbs</span><strong>✿ ${p.herbs}</strong></div><div class="resource"><span>Coin</span><strong>◉ ${p.wealth}</strong></div></div></div><div class="section"><div class="section-title">What will you do?</div><div class="action-grid"><button data-action="Explore">⌖ Explore</button><button data-action="Forage">✿ Forage</button><button data-action="Hunt">♧ Hunt</button><button data-action="Rest">☾ Rest</button><button data-action="Build">⌂ Build</button><button data-action="Talk">♡ Talk</button><button data-action="Trade">⇄ Trade</button><button data-action="Eat">◈ Eat</button></div></div><div class="notice">Today: ${worldTile.t[0].toUpperCase()+worldTile.t.slice(1)} · ${G.weather}<br><span style="color:#b4bdac">${worldTile.resource} nearby · ${worldTile.food} wild food</span></div>`}

function renderSettlement(){let s=G.settlement;return `<div class="section"><div class="eyebrow">A small community</div><h3 style="font-size:19px;margin:3px 0">${s.name}</h3><div class="person-sub">River settlement · ${s.government}</div></div><div class="resources"><div class="resource"><span>People</span><strong>${s.population}</strong></div><div class="resource"><span>Homes & halls</span><strong>${s.buildings}</strong></div><div class="resource"><span>Food stores</span><strong>${s.food} bags</strong></div><div class="resource"><span>Timber</span><strong>${s.wood} loads</strong></div><div class="resource"><span>Stone</span><strong>${s.stone} blocks</strong></div><div class="resource"><span>Knowledge</span><strong>${s.knowledge} crafts</strong></div></div><div class="section">${bar('Prosperity',s.prosperity)}${bar('Social trust',s.stability)}${bar('Public health',s.health)}</div><div class="section"><div class="section-title">Shared projects</div><div class="event">🌾 ${s.fields} garden plots — daily yield follows soil and rainfall.</div><div class="event">⌂ ${s.buildings} buildings — neighbors add homes when stores are healthy.</div><div class="event">◉ Market prices fluctuate with food shortages and abundance.</div></div><button id="donateBtn">Contribute 2 food · ease the shortage</button>`}
function renderSociety(){let alive=G.people.filter(p=>p.alive).sort((a,b)=>b.happiness-a.happiness),avg=Math.round(alive.reduce((n,p)=>n+p.happiness,0)/(alive.length||1)),workers={};alive.forEach(p=>workers[p.job]=(workers[p.job]||0)+1);let work=Object.entries(workers).sort((a,b)=>b[1]-a[1]).map(([j,n])=>`<div class="stat-row"><span>${j[0].toUpperCase()+j.slice(1)}</span><strong>${n}</strong></div>`).join('');return `<div class="section"><div class="eyebrow">People of ${G.worldName}</div><h3 style="font-size:18px;margin:4px 0">${alive.length} lives, one valley</h3><p class="person-sub">A handful are close enough for detailed daily simulation. Everyone else is carried by settlement-level rhythms.</p></div><div class="section"><div class="section-title">Community profile</div>${bar('Average contentment',avg)}${bar('Forest health',G.eco.forest)}${bar('Water quality',G.eco.water)}${bar('Soil fertility',G.eco.soil)}</div><div class="section"><div class="section-title">Occupations</div>${work}</div><div class="section"><div class="section-title">Known residents <span class="pill">tap to follow</span></div>${alive.slice(0,14).map(p=>`<div class="event person-link" data-person="${p.id}" style="cursor:pointer"><small>AGE ${Math.floor(p.age)} · ${p.job.toUpperCase()}</small>${p.name} · ${p.traits.join(', ')}</div>`).join('')}</div>`}
function renderObserver(){let content=G.panel==='settlement'?renderSettlement():G.panel==='society'?renderSociety():renderChronicle();$('#observerContent').innerHTML=content;$$('.tabs button').forEach(b=>b.classList.toggle('selected',b.dataset.panel===G.panel));$$('[data-person]').forEach(el=>el.onclick=()=>inspectPerson(+el.dataset.person));let donate=$('#donateBtn');if(donate)donate.onclick=()=>{if(G.player.food<2){toast('You need 2 food to contribute');return}G.player.food-=2;G.settlement.food+=2;G.settlement.stability=clamp(G.settlement.stability+3,0,100);G.player.reputation++;addEvent(`${G.player.name} shares food with the communal store. Neighbors remember the kindness.`,'important');renderAll()}}
function renderAll(){if(!G)return;updateDate();$('#worldName').textContent=G.worldName;$('#worldMeta').textContent=`Seed ${String(G.seed).padStart(6,'0')} · ${G.settlement.population.toLocaleString()} lives`;$('#simStatus').textContent=G.paused?'Time paused':`${G.weather} · ${G.speed}× simulation`;$('#pauseBtn').textContent=G.paused?'▶':'Ⅱ';$('#speedBtn').textContent=`${G.speed}×`;renderPlayer();$$('[data-action]').forEach(b=>b.onclick=()=>doAction(b.dataset.action));renderObserver();$$('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===G.view));drawWorld()}

function doAction(action){let p=G.player,tile=G.tiles[p.y*G.w+p.x],s=G.settlement,msg='';
 if(action==='Forage'){if(['ocean','deep','mountain','snow'].includes(tile.t)){msg='There is little to forage here.'}else{let amount=1+Math.floor(Math.random()*Math.max(1,tile.food/3));if(tile.resource==='wood'&&['forest','jungle'].includes(tile.t)){p.wood+=amount;msg=`Gathered ${amount} timber from the treeline.`}else if(tile.resource==='herbs'){p.herbs+=amount;msg=`Found ${amount} bundles of useful herbs.`}else{p.food+=amount;msg=`Collected ${amount} food from the wild.`}G.eco.forest=clamp(G.eco.forest-(tile.t==='forest'?1:0),0,100)}}
 if(action==='Hunt'){if(G.eco.wildlife<12){msg='The nearby game has grown scarce. Let the land recover.'}else if(Math.random()<.78){let n=2+Math.floor(Math.random()*3);p.food+=n;G.eco.wildlife=clamp(G.eco.wildlife-2,0,100);msg=`A careful hunt brings ${n} food. Wildlife grows a little warier.`}else{p.health=clamp(p.health-5,0,100);msg='The hunt goes poorly; you return with a bruised arm.'}}
 if(action==='Rest'){p.stamina=clamp(p.stamina+48,0,100);p.health=clamp(p.health+8,0,100);p.hunger=clamp(p.hunger-8,0,100);p.thirst=clamp(p.thirst-10,0,100);p.happiness=clamp(p.happiness+3,0,100);msg='You rest by the river. Strength and spirits return.'}
 if(action==='Eat'){if(p.food<1){msg='Your satchel is empty. Forage or visit the market.'}else{p.food--;p.hunger=clamp(p.hunger-38,0,100);p.happiness=clamp(p.happiness+2,0,100);msg='A simple meal settles your stomach.'}}
 if(action==='Talk'){let near=G.people.filter(n=>n.alive).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(near&&Math.hypot(near.x-p.x,near.y-p.y)<9){near.affinity=(near.affinity||22)+5;near.happiness=clamp(near.happiness+2,0,100);near.memory=`A warm conversation with ${p.name} on day ${G.day}.`;p.happiness=clamp(p.happiness+4,0,100);msg=`You share a thoughtful conversation with ${near.name}. Trust grows.`;addEvent(`${p.name} and ${near.name} share a conversation beside the river.`)}else msg='No one is nearby. Travel toward Hearthmere to meet the neighbors.'}
 if(action==='Trade'){openTrade();return}if(action==='Build'){openBuild();return}
 if(action==='Explore'){msg=`You take in the ${tile.t} country. ${tile.t==='mountain'?'A stony pass may connect distant valleys.':tile.t==='river'?'The river is the old road through this land.':'The wind carries stories from beyond the horizon.'}`;p.happiness=clamp(p.happiness+2,0,100);if(tile.t==='village')p.reputation++}
 if(msg)addEvent(msg,action==='Talk'?'important':'normal');advance(1);toast(msg||`${action} completed`)}
function openBuild(){showModal('Build with the neighbors',`<p>Work together to leave a lasting mark on the valley. Materials come from your satchel; the community supplies labor.</p><div class="section"><button data-build="field">🌾 Plant a field · 2 wood</button> <button data-build="shelter">⌂ Raise a shelter · 3 wood</button> <button data-build="workshop">⚒ Open a workshop · 2 wood, 2 herbs</button></div><p class="person-sub">Fields need fertile ground. Construction adds to Hearthmere's shared infrastructure.</p>`);$$('[data-build]').forEach(b=>b.onclick=()=>{let kind=b.dataset.build,p=G.player,s=G.settlement;if(kind==='field'&&p.wood>=2&&G.eco.soil>15){p.wood-=2;s.fields++;s.food+=5;G.eco.soil=clamp(G.eco.soil-1,0,100);addEvent(`${p.name} helps turn a patch of land into a new communal field.`,'important')}else if(kind==='shelter'&&p.wood>=3){p.wood-=3;s.buildings++;s.population++;let id=Math.max(0,...G.people.map(n=>n.id))+1;G.people.push({id,name:`${names[Math.floor(Math.random()*names.length)]} ${surnames[Math.floor(Math.random()*surnames.length)]}`,age:24,job:'builder',traits:['hopeful','resourceful'],health:92,happiness:72,wealth:5,x:p.x,y:p.y,family:[],memory:`Found a home in ${s.name} on day ${G.day}.`,alive:true,home:s.name});addEvent(`${p.name} raises a shelter; a traveling family settles in Hearthmere.`,'important')}else if(kind==='workshop'&&p.wood>=2&&p.herbs>=2){p.wood-=2;p.herbs-=2;s.buildings++;s.knowledge++;addEvent(`${p.name} helps open a workshop where craftspeople share techniques.`,'important')}else{toast('Not enough materials, or the land needs time to recover.');return}closeModal();advance(1)})}
function openTrade(){let p=G.player,s=G.settlement;showModal('Market at Hearthmere',`<p>Prices shift with local harvest and scarcity. The village market offers no guaranteed bargains.</p><div class="resources"><div class="resource"><span>Food stores</span><strong>${s.food} bags</strong></div><div class="resource"><span>Your coin</span><strong>${p.wealth} coins</strong></div></div><div class="section" style="margin-top:14px"><button id="buyFood">Buy 3 food · ${s.food<18?8:4} coins</button> <button id="sellFood">Sell 2 food · ${s.food<18?7:3} coins</button></div>`);$('#buyFood').onclick=()=>{let cost=s.food<18?8:4;if(p.wealth<cost||s.food<3){toast('The market cannot fill that order.');return}p.wealth-=cost;p.food+=3;s.food-=3;addEvent(`${p.name} buys a small food bundle at market.`);closeModal();advance(1)};$('#sellFood').onclick=()=>{if(p.food<2){toast('You need 2 food to sell.');return}let price=s.food<18?7:3;p.food-=2;p.wealth+=price;s.food+=2;addEvent(`${p.name} sells surplus food at the market.`);closeModal();advance(1)}}

function setZoom(next){let b=cvs.getBoundingClientRect(),oldCell=clamp(28*G.zoom,14,54),centerX=G.cam.x+b.width/2,centerY=G.cam.y+b.height/2;G.zoom=clamp(next,.5,1.9);let newCell=clamp(28*G.zoom,14,54);G.cam.x=centerX/oldCell*newCell-b.width/2;G.cam.y=centerY/oldCell*newCell-b.height/2;drawWorld()}
