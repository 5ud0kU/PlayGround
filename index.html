<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--ink:#f3f2e9;--muted:#a9b5ad;--lime:#d8f36a;--panel:rgba(22,34,32,.88);--line:rgba(237,245,226,.13)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e8d8;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;touch-action:none}canvas{display:block;position:absolute;inset:0;outline:none}.grain{position:absolute;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
.topbar{position:absolute;z-index:5;left:22px;right:22px;top:18px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand,.top-actions{pointer-events:auto}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:#d9f36a;color:#243229;display:grid;place-items:center;box-shadow:0 6px 22px #1c3e2940}.logo svg{width:25px;height:25px}.brand-name{font-weight:800;font-size:15px;letter-spacing:-.4px}.brand-sub{font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:1.5px;color:#52675b;margin-top:3px}.top-actions{display:flex;gap:8px;align-items:center}.pill,.icon-btn{border:1px solid #ffffff53;background:#f8fff0d9;color:#34433a;backdrop-filter:blur(16px);border-radius:12px;height:40px;padding:0 14px;display:flex;align-items:center;gap:8px;font:600 12px 'DM Sans',sans-serif;box-shadow:0 5px 16px #27462b15;cursor:pointer;transition:.18s}.pill:hover,.icon-btn:hover{transform:translateY(-2px);background:#fff}.icon-btn{width:40px;padding:0;justify-content:center}.live-dot{height:7px;width:7px;border-radius:9px;background:#66bb84;box-shadow:0 0 0 4px #66bb8424}.stats{position:absolute;z-index:4;right:22px;top:76px;display:flex;gap:8px}.stat{background:#f8fff0d9;color:#34433a;border:1px solid #fff9;border-radius:12px;padding:9px 13px;backdrop-filter:blur(14px);box-shadow:0 5px 16px #27462b12;min-width:76px}.stat-label{font:9px 'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:#7a8b7d}.stat-value{font-size:15px;font-weight:800;margin-top:2px}.stat-value small{font-size:10px;font-weight:500;color:#758078}
.left-card{position:absolute;z-index:4;left:22px;top:91px;width:210px;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:0 14px 38px #1c35241f;backdrop-filter:blur(18px)}.eyebrow{font:9px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:1.5px;color:#b5c3b4}.card-title{font-size:14px;font-weight:700;margin:5px 0 12px;letter-spacing:-.2px}.tools{display:grid;gap:7px}.tool{border:1px solid transparent;color:#e8eee4;background:#ffffff0b;display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:11px;text-align:left;cursor:pointer;transition:.17s;font:600 12px 'DM Sans',sans-serif}.tool:hover{background:#ffffff18}.tool.active{background:#d9f36a;color:#25332a;box-shadow:0 4px 14px #c6e95c2f}.tool-icon{width:32px;height:32px;border-radius:9px;background:#ffffff12;display:grid;place-items:center;font-size:18px}.tool.active .tool-icon{background:#25332a14}.tool-copy{flex:1}.tool-name{display:block}.tool-detail{display:block;font:9px 'DM Mono',monospace;opacity:.62;margin-top:2px}.keycap{font:9px 'DM Mono',monospace;opacity:.55}.divider{height:1px;background:var(--line);margin:13px 0}.gravity-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#d4ddd1}.gravity-toggle{width:34px;height:19px;border:0;border-radius:12px;background:#d8f36a;padding:3px;cursor:pointer}.gravity-toggle:after{content:'';display:block;width:13px;height:13px;border-radius:50%;background:#29352c;transition:transform .2s}.gravity-toggle.off{background:#52635b}.gravity-toggle.off:after{transform:translateX(15px);background:white}.slider-wrap{margin-top:11px}.slider-label{display:flex;justify-content:space-between;color:#aab8ac;font:9px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}.slider-wrap input{width:100%;accent-color:var(--lime);height:3px}
.bottom-hint{position:absolute;z-index:4;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:12px;background:#f8fff0d9;color:#405346;border:1px solid #ffffffba;backdrop-filter:blur(16px);box-shadow:0 6px 20px #27462b18;font-size:11px;white-space:nowrap;pointer-events:none}.hint-icon{color:#596e5d;font-size:15px}.hint-key{border:1px solid #bcc9b9;border-bottom-width:2px;border-radius:4px;padding:2px 5px;font:9px 'DM Mono',monospace;color:#526355}.right-bottom{position:absolute;z-index:4;bottom:20px;right:22px;display:flex;gap:7px}.small-btn{width:42px;height:42px;border-radius:12px;border:1px solid #ffffffab;background:#f8fff0dc;color:#394a3d;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 16px #27462b12;transition:.18s}.small-btn:hover{transform:translateY(-2px);background:#fff}.small-btn svg{width:17px;height:17px}.toast{position:absolute;z-index:10;top:77px;left:50%;transform:translate(-50%,-10px);opacity:0;background:#1a2b24;color:#edf4e9;border:1px solid #ffffff20;border-radius:99px;padding:10px 16px;font-size:11px;box-shadow:0 8px 25px #0002;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.touch-note{display:none}
@media(max-width:700px){.topbar{left:13px;right:13px;top:12px}.brand-name{font-size:13px}.brand-sub{font-size:8px}.logo{width:37px;height:37px}.top-actions .pill{height:36px;padding:0 10px;font-size:10px}.top-actions .icon-btn{height:36px;width:36px}.stats{top:61px;right:13px;gap:5px}.stat{min-width:60px;padding:7px 9px;border-radius:10px}.stat-label{font-size:8px}.stat-value{font-size:13px}.left-card{top:auto;bottom:74px;left:12px;width:auto;right:12px;padding:10px 11px;border-radius:14px}.left-card .eyebrow,.left-card .card-title,.left-card .divider,.gravity-row,.slider-wrap{display:none}.tools{display:flex;gap:7px;justify-content:space-between}.tool{flex:1;justify-content:center;padding:6px 3px;gap:4px;flex-direction:column;text-align:center;border-radius:10px}.tool-icon{width:29px;height:27px;font-size:16px}.tool-name{font-size:10px}.tool-detail,.keycap{display:none}.bottom-hint{bottom:15px;left:12px;right:12px;transform:none;justify-content:center;gap:6px;padding:9px;font-size:9px}.right-bottom{bottom:133px;right:13px;flex-direction:column}.small-btn{width:36px;height:36px}.touch-note{display:inline}}
@media(max-height:600px) and (min-width:701px){.left-card{top:75px;padding:11px}.card-title{margin:3px 0 7px}.tool{padding:5px 8px}.tool-icon{width:27px;height:27px}.divider{margin:8px 0}.bottom-hint{bottom:12px}}
</style></head><body>
<canvas id="world"></canvas><div class="grain"></div><header class="topbar"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13.5 12 5l8 8.5M7 11v8h10v-8M10 19v-5h4v5"/><path d="m3 8 2-2m14 0 2 2"/></svg></div><div><div class="brand-name">little physics</div><div class="brand-sub">town sandbox · 01</div></div></div><div class="top-actions"><button class="pill" id="playBtn"><span class="live-dot"></span><span id="playText">SIMULATION LIVE</span></button><button class="icon-btn" id="resetBtn" title="Reset town (R)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg></button></div></header>
<div class="stats"><div class="stat"><div class="stat-label">Objects</div><div class="stat-value"><span id="objectCount">0</span><small> / 40</small></div></div><div class="stat"><div class="stat-label">Impact</div><div class="stat-value"><span id="impactValue">0</span><small> km/h</small></div></div><div class="stat"><div class="stat-label">Time</div><div class="stat-value" id="clock">09:41</div></div></div>
<aside class="left-card"><div class="eyebrow">Object launcher</div><div class="card-title">Pick something to throw</div><div class="tools"><button class="tool active" data-kind="crate"><span class="tool-icon">📦</span><span class="tool-copy"><span class="tool-name">Wood crate</span><span class="tool-detail">Heavy · bouncy</span></span><span class="keycap">1</span></button><button class="tool" data-kind="ball"><span class="tool-icon">🏀</span><span class="tool-copy"><span class="tool-name">Super ball</span><span class="tool-detail">Light · very bouncy</span></span><span class="keycap">2</span></button><button class="tool" data-kind="barrel"><span class="tool-icon">🛢️</span><span class="tool-copy"><span class="tool-name">Oil drum</span><span class="tool-detail">Heavy · rolls</span></span><span class="keycap">3</span></button><button class="tool" data-kind="rock"><span class="tool-icon">🪨</span><span class="tool-copy"><span class="tool-name">Big rock</span><span class="tool-detail">Very heavy · solid</span></span><span class="keycap">4</span></button></div><div class="divider"></div><div class="gravity-row"><span>Gravity</span><button id="gravityBtn" class="gravity-toggle" aria-label="Toggle gravity"></button></div><div class="slider-wrap"><div class="slider-label"><span>Throw power</span><span id="powerLabel">100%</span></div><input id="power" type="range" min="40" max="150" value="100"></div></aside>
<div class="bottom-hint"><span class="hint-icon">✳</span><span><b>Drag</b> to launch</span><span class="hint-key">1—4</span><span>select object</span><span class="hint-key">right-drag</span><span>to orbit <span class="touch-note">· two fingers</span></span></div><div class="right-bottom"><button class="small-btn" id="zoomIn" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5M10.8 7.5v6.6M7.5 10.8h6.6"/></svg></button><button class="small-btn" id="zoomOut" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5M7.5 10.8h6.6"/></svg></button><button class="small-btn" id="homeView" title="Reset camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></button></div><div class="toast" id="toast">Crate launched!</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas = document.querySelector('#world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#d9e8d8');
scene.fog = new THREE.Fog('#d9e8d8', 46, 95);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 150);
function resizeRenderer() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setSize(width, height);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);
let target = new THREE.Vector3(0, 0, 0);
let radius = 40;
let azimuth = Math.PI * 0.25;
let polar = 1.02;
const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

function updateCamera() {
  camera.position.set(
    target.x + radius * Math.sin(polar) * Math.sin(azimuth),
    target.y + radius * Math.cos(polar),
    target.z + radius * Math.sin(polar) * Math.cos(azimuth)
  );
  camera.lookAt(target);
}
updateCamera();

scene.add(new THREE.HemisphereLight('#f9ffec', '#788c78', 2.05));
const sun = new THREE.DirectionalLight('#fff4cf', 3.3);
sun.position.set(-22, 32, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -35;
sun.shadow.bias = -0.0002;
scene.add(sun);

const mat = (color, rough = 0.85, metal = 0) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
const grass = mat('#a9c49a');
const road = mat('#626f6b');
const sidewalk = mat('#d7d5c1');
const white = mat('#f3f0dc');
const dark = mat('#273a36');
const trunkMat = mat('#795a43');
const leafMats = ['#547e59', '#73956a', '#8ca16d', '#567865'].map(c => mat(c));

function box(parent, x, y, z, sx, sy, sz, material, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
  m.position.set(x, y, z);
  m.castShadow = shadow;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cyl(parent, x, y, z, r1, r2, h, material, segments = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, segments), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function sphere(parent, x, y, z, r, material, seg = 12) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(8, seg - 2)), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(110, 110), grass);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.12;
ground.receiveShadow = true;
scene.add(ground);

for (let i = 0; i < 18; i++) {
  const a = i / 18 * Math.PI * 2;
  const r = 48 + (i % 3) * 3;
  const hill = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), mat(i % 2 ? '#b8d0ae' : '#c3d6b7'));
  hill.position.set(Math.cos(a) * r, -2.5, Math.sin(a) * r);
  hill.scale.set(10, 4 + (i % 4), 8);
  scene.add(hill);
}

box(scene, 0, -0.015, 0, 42, 0.12, 7, road, false);
box(scene, 0, -0.012, 0, 7, 0.13, 38, road, false);
for (let x = -19; x <= 19; x += 3) box(scene, x, 0.055, 0, 0.07, 0.012, 5.9, mat('#ded6a9'), false);
for (let z = -17; z <= 17; z += 3) box(scene, 0, 0.058, z, 5.9, 0.012, 0.07, mat('#ded6a9'), false);
for (const s of [-1, 1]) {
  box(scene, 0, 0.012, s * 4.25, 42, 0.16, 0.9, sidewalk, false);
  box(scene, s * 4.25, 0.012, 0, 0.9, 0.16, 38, sidewalk, false);
  box(scene, 0, 0.012, s * 8, 42, 0.12, 0.42, sidewalk, false);
  box(scene, s * 8, 0.012, 0, 0.42, 0.12, 38, sidewalk, false);
}
for (let side of [-1, 1]) for (let i = -3; i <= 3; i++) {
  box(scene, i * 0.55, 0.07, side * 4.1, 0.28, 0.025, 0.75, white, false);
  box(scene, side * 4.1, 0.07, i * 0.55, 0.75, 0.025, 0.28, white, false);
}

const houses = [];
function addHouse(x, z, wallColor, roofColor, rot = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  scene.add(g);
  const w = 4.2, d = 3.7, h = 2.5;
  box(g, 0, h / 2, 0, w, h, d, mat(wallColor));
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.7, 4), mat(roofColor));
  roof.position.y = h + 0.74;
  roof.rotation.y = Math.PI / 4;
  roof.scale.set(1, 1, 0.85);
  roof.castShadow = true;
  g.add(roof);
  box(g, 0, 0.76, d / 2 + 0.025, 0.76, 1.52, 0.08, mat('#785843'));
  box(g, 0, 0.75, d / 2 + 0.08, 0.54, 1.15, 0.025, mat('#c78b58'));
  for (const wx of [-1.25, 1.25]) {
    box(g, wx, 1.62, d / 2 + 0.055, 0.82, 0.78, 0.08, mat('#e5dfc7'));
    box(g, wx, 1.62, d / 2 + 0.105, 0.59, 0.56, 0.035, mat('#91b9b1'));
    box(g, wx, 1.62, d / 2 + 0.13, 0.045, 0.58, 0.02, white);
    box(g, wx, 1.62, d / 2 + 0.13, 0.61, 0.045, 0.02, white);
  }
  box(g, 1.15, 3.35, -0.65, 0.55, 1.45, 0.58, mat('#995f4f'));
  box(g, 0, 0.09, d / 2 + 0.48, 1.3, 0.18, 0.55, sidewalk);
  for (let sx of [-1, 1]) {
    const bush = sphere(g, sx * 1.75, 0.37, 2.38, 0.42, mat('#668464'), 9);
    bush.scale.set(1.3, 0.8, 0.75);
  }
  houses.push({ x, z, rx: w / 2 + 0.12, rz: d / 2 + 0.12, top: 4.5 });
}
addHouse(-11, -10, '#eee1c8', '#bd7051');
addHouse(11, -10, '#d7e4d7', '#5c8390');
addHouse(-11, 10, '#f1d8bd', '#d0a050', Math.PI);
addHouse(11, 10, '#e1e4ce', '#718967', Math.PI);

const treePositions = [[-15, -6], [-7, -6], [7, -6], [15, -6], [-15, 6], [-7, 6], [7, 6], [15, 6], [-18, -13], [-5, -13], [5, -13], [18, -13], [-18, 13], [-5, 13], [5, 13], [18, 13]];
for (let i = 0; i < treePositions.length; i++) {
  const [x, z] = treePositions[i];
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  scene.add(g);
  cyl(g, 0, 0.78, 0, 0.24, 0.31, 1.55, trunkMat, 8);
  const leaf = leafMats[i % leafMats.length];
  const crown = sphere(g, 0, 2.05, 0, 0.95, leaf, 9);
  crown.scale.set(1, 1.12, 0.94);
  sphere(g, -0.45, 1.8, 0.1, 0.58, leaf, 8);
  sphere(g, 0.47, 1.85, -0.06, 0.58, leaf, 8);
}

const fenceMat = mat('#e9e3ce');
for (const hx of [-11, 11]) for (const hz of [-10, 10]) {
  let z = hz + (hz < 0 ? 2.75 : -2.75);
  for (let i = -3; i <= 3; i++) {
    box(scene, hx + i * 0.48, 0.48, z, 0.1, 0.9, 0.1, fenceMat);
    if (i < 3) box(scene, hx + (i + 0.5) * 0.48, 0.46, z, 0.42, 0.1, 0.08, fenceMat);
  }
  box(scene, hx + (hx < 0 ? 2.8 : -2.8), 0.48, hz, 0.1, 0.9, 2.2, fenceMat);
}

const lampMat = mat('#34423c', 0.48, 0.35), bulbMat = new THREE.MeshStandardMaterial({ color: '#fff2bd', emissive: '#ffe397', emissiveIntensity: 1.5 });
const lampPositions = [[-5, -5], [5, -5], [-5, 5], [5, 5], [-20, 0], [20, 0], [0, -18], [0, 18]];
for (const [x, z] of lampPositions) {
  cyl(scene, x, 0.95, z, 0.075, 0.09, 1.9, lampMat, 8);
  box(scene, x, 0.18, z, 0.42, 0.2, 0.42, lampMat);
  box(scene, x + 0.25, 1.82, z, 0.52, 0.07, 0.07, lampMat);
  sphere(scene, x + 0.49, 1.75, z, 0.17, bulbMat, 8);
}

function addCar(x, z, color, rot = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  scene.add(g);
  box(g, 0, 0.48, 0, 2.65, 0.68, 1.3, mat(color, 0.55));
  box(g, -0.06, 0.96, 0, 1.35, 0.48, 1.12, mat('#a8c6c3', 0.28));
  for (const xx of [-0.85, 0.85]) for (const zz of [-0.7, 0.7]) cyl(g, xx, 0.28, zz, 0.3, 0.3, 0.16, mat('#28312f'), 12).rotation.z = Math.PI / 2;
  box(g, 1.28, 0.53, 0, 0.1, 0.2, 1.05, mat('#f3d37e'));
  box(g, -1.34, 0.53, 0, 0.1, 0.2, 1.05, mat('#d26b5f'));
}
addCar(-6.3, -4.55, '#d5725e');
addCar(6.4, 4.55, '#587e80', Math.PI);
addCar(4.55, -12.1, '#e5bf63', Math.PI / 2);

const park = mat('#9fbd8b');
box(scene, 0, 0.015, 13.7, 10, 0.08, 7, park, false);
const pondMat = new THREE.MeshStandardMaterial({ color: '#83babe', roughness: 0.22, metalness: 0.1 });
const pond = new THREE.Mesh(new THREE.CylinderGeometry(2.15, 2.15, 0.12, 32), pondMat);
pond.position.set(0, 0.1, 13.7);
scene.add(pond);
cyl(scene, 0, 0.19, 13.7, 0.28, 0.28, 0.28, white, 12);
for (let i = 0; i < 5; i++) {
  const a = i / 5 * Math.PI * 2;
  sphere(scene, Math.cos(a) * 3.1, 0.25, 13.7 + Math.sin(a) * 3.1, 0.3, leafMats[i % 4], 8);
}

const benchWood = mat('#a77b51'), binMat = mat('#55716a');
for (const [x, z, r] of [[-5, -8, 0], [5, 8, Math.PI], [-17, 0, Math.PI / 2], [17, 0, -Math.PI / 2]]) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = r;
  scene.add(g);
  box(g, 0, 0.58, 0, 1.35, 0.13, 0.42, benchWood);
  for (const xx of [-0.5, 0.5]) {
    box(g, xx, 0.32, 0, 0.1, 0.52, 0.1, lampMat);
    box(g, xx, 0.78, -0.19, 0.1, 0.42, 0.09, benchWood);
  }
  box(g, 1.15, 0.42, 0.15, 0.45, 0.82, 0.45, binMat);
}

const signG = new THREE.Group();
signG.position.set(-2.2, 0, -8);
scene.add(signG);
cyl(signG, 0, 0.8, 0, 0.08, 0.08, 1.6, trunkMat, 8);
box(signG, 0, 1.63, 0, 2.1, 0.72, 0.16, mat('#314a40'));
box(signG, 0, 1.63, 0.1, 1.92, 0.54, 0.04, mat('#d7ed9b'));

const staticColliders = [...houses, { x: -6.3, z: -4.55, rx: 1.45, rz: 0.8, top: 1.5 }, { x: 6.4, z: 4.55, rx: 1.45, rz: 0.8, top: 1.5 }, { x: 4.55, z: -12.1, rx: 0.8, rz: 1.45, top: 1.5 }];
const definitions = {
  crate: { label: 'Wood crate', radius: 0.69, mass: 1.55, bounce: 0.34, color: '#c58b53' },
  ball: { label: 'Super ball', radius: 0.61, mass: 0.55, bounce: 0.84, color: '#ee765a' },
  barrel: { label: 'Oil drum', radius: 0.62, mass: 1.25, bounce: 0.28, color: '#587f7d' },
  rock: { label: 'Big rock', radius: 0.78, mass: 2.5, bounce: 0.18, color: '#777d73' }
};
const bodies = [];
let selected = 'crate';
let gravityOn = true;
let paused = false;
let power = 1;
let impact = 0;
let lastImpactAt = 0;

function makeBody(kind, position, velocity = new THREE.Vector3()) {
  const d = definitions[kind];
  let mesh;
  if (kind === 'crate') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(1.16, 1.16, 1.16), mat(d.color, 0.9));
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({ color: '#815936', transparent: true, opacity: 0.65 })));
  } else if (kind === 'ball') {
    mesh = new THREE.Mesh(new THREE.SphereGeometry(d.radius, 20, 14), new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.25 }));
    for (let i = 0; i < 2; i++) {
      const stripe = new THREE.Mesh(new THREE.TorusGeometry(d.radius * 0.72, 0.035, 6, 36), mat('#fff1d2', 0.4));
      stripe.rotation.set(i * Math.PI / 2, 0, i * Math.PI / 2);
      mesh.add(stripe);
    }
  } else if (kind === 'barrel') {
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 1.3, 16), new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.47, metalness: 0.26 }));
    for (const y of [-0.38, 0.38]) {
      const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.525, 0.045, 6, 16), mat('#bcc4b3', 0.35, 0.5));
      hoop.rotation.x = Math.PI / 2;
      hoop.position.y = y;
      mesh.add(hoop);
    }
  } else {
    mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.68, 1), mat(d.color, 1));
    mesh.scale.set(1.12, 0.92, 1);
  }
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.copy(position);
  scene.add(mesh);
  const body = {
    kind,
    mesh,
    pos: position.clone(),
    vel: velocity.clone(),
    rotVel: new THREE.Vector3((Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5),
    radius: d.radius,
    mass: d.mass,
    bounce: d.bounce,
    sleep: 0
  };
  bodies.push(body);
  if (bodies.length > 40) {
    const old = bodies.shift();
    scene.remove(old.mesh);
    old.mesh.geometry.dispose();
  }
  document.querySelector('#objectCount').textContent = bodies.length;
  return body;
}

function collideTown(b) {
  const r = b.radius;
  for (const c of staticColliders) {
    const dx = b.pos.x - c.x;
    const dz = b.pos.z - c.z;
    const px = c.rx + r - Math.abs(dx);
    const pz = c.rz + r - Math.abs(dz);
    if (px > 0 && pz > 0 && b.pos.y - r < c.top && b.pos.y + r > 0.08) {
      if (px < pz) {
        b.pos.x += dx >= 0 ? px : -px;
        if ((dx >= 0 ? b.vel.x : -b.vel.x) < 0) b.vel.x = -b.vel.x * 0.55;
      } else {
        b.pos.z += dz >= 0 ? pz : -pz;
        if ((dz >= 0 ? b.vel.z : -b.vel.z) < 0) b.vel.z = -b.vel.z * 0.55;
      }
      b.vel.multiplyScalar(0.94);
      b.sleep = 0;
    }
  }
  for (const [x, z] of [...treePositions, ...lampPositions]) {
    const dx = b.pos.x - x;
    const dz = b.pos.z - z;
    const dist = Math.hypot(dx, dz);
    const min = r + 0.31;
    if (dist < min && b.pos.y < 2.1) {
      const nx = dx / (dist || 0.001);
      const nz = dz / (dist || 0.001);
      b.pos.x = x + nx * min;
      b.pos.z = z + nz * min;
      const vn = b.vel.x * nx + b.vel.z * nz;
      if (vn < 0) {
        b.vel.x -= 1.55 * vn * nx;
        b.vel.z -= 1.55 * vn * nz;
      }
      b.sleep = 0;
    }
  }
}

function physics(dt) {
  const step = dt / 2;
  for (let s = 0; s < 2; s++) {
    for (const b of bodies) {
      if (b.sleep > 1.3) continue;
      if (gravityOn) b.vel.y -= 17 * step;
      b.pos.addScaledVector(b.vel, step);
      b.mesh.rotation.x += b.rotVel.x * step;
      b.mesh.rotation.y += b.rotVel.y * step;
      b.mesh.rotation.z += b.rotVel.z * step;

      const floorY = b.radius;
      if (b.pos.y < floorY) {
        b.pos.y = floorY;
        if (b.vel.y < -0.6) {
          const speed = Math.abs(b.vel.y);
          if (speed > 4 && performance.now() - lastImpactAt > 220) {
            impact = Math.max(impact, Math.round(speed * 3.6));
            lastImpactAt = performance.now();
          }
          b.vel.y = -b.vel.y * b.bounce;
          b.vel.x *= 0.82;
          b.vel.z *= 0.82;
          b.rotVel.x += b.vel.z * 0.06;
          b.rotVel.z -= b.vel.x * 0.06;
          if (Math.abs(b.vel.y) < 1.05) b.vel.y = 0;
        } else {
          b.vel.y = 0;
        }
        b.vel.x *= Math.pow(0.86, step * 60);
        b.vel.z *= Math.pow(0.86, step * 60);
        b.rotVel.multiplyScalar(0.97);
      }
      if (Math.abs(b.pos.x) > 25) {
        b.pos.x = Math.sign(b.pos.x) * 25;
        b.vel.x *= -0.6;
      }
      if (Math.abs(b.pos.z) > 23) {
        b.pos.z = Math.sign(b.pos.z) * 23;
        b.vel.z *= -0.6;
      }

      collideTown(b);
      b.vel.multiplyScalar(Math.pow(0.997, step * 60));
      if (b.vel.length() < 0.09 && b.pos.y <= floorY + 0.015) b.sleep += step;
      else b.sleep = 0;
      b.mesh.position.copy(b.pos);
      document.querySelector('#impactValue').textContent = impact;
    }

    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const a = bodies[i], b = bodies[j];
        const dx = b.pos.x - a.pos.x;
        const dy = b.pos.y - a.pos.y;
        const dz = b.pos.z - a.pos.z;
        const d = Math.hypot(dx, dy, dz);
        const min = a.radius + b.radius;
        if (d < min && d > 0.001) {
          const nx = dx / d;
          const ny = dy / d;
          const nz = dz / d;
          const o = min - d;
          a.pos.x -= nx * o * 0.5;
          a.pos.y -= ny * o * 0.5;
          a.pos.z -= nz * o * 0.5;
          b.pos.x += nx * o * 0.5;
          b.pos.y += ny * o * 0.5;
          b.pos.z += nz * o * 0.5;
          const rel = (b.vel.x - a.vel.x) * nx + (b.vel.y - a.vel.y) * ny + (b.vel.z - a.vel.z) * nz;
          if (rel < 0) {
            const jn = -(1 + Math.min(a.bounce, b.bounce)) * rel / (1 / a.mass + 1 / b.mass);
            a.vel.x -= jn * nx / a.mass;
            a.vel.y -= jn * ny / a.mass;
            a.vel.z -= jn * nz / a.mass;
            b.vel.x += jn * nx / b.mass;
            b.vel.y += jn * ny / b.mass;
            b.vel.z += jn * nz / b.mass;
            if (Math.abs(rel) > 4) {
              impact = Math.max(impact, Math.round(Math.abs(rel) * 3.6));
              lastImpactAt = performance.now();
            }
          }
          a.sleep = b.sleep = 0;
        }
      }
    }
  }
}

const ui = {
  power: document.querySelector('#power'),
  powerLabel: document.querySelector('#powerLabel'),
  gravityBtn: document.querySelector('#gravityBtn'),
  playBtn: document.querySelector('#playBtn'),
  playText: document.querySelector('#playText'),
  resetBtn: document.querySelector('#resetBtn'),
  objectCount: document.querySelector('#objectCount'),
  impactValue: document.querySelector('#impactValue'),
  clock: document.querySelector('#clock'),
  toast: document.querySelector('#toast'),
  zoomIn: document.querySelector('#zoomIn'),
  zoomOut: document.querySelector('#zoomOut'),
  homeView: document.querySelector('#homeView')
};

function updatePowerUi() {
  ui.powerLabel.textContent = `${Math.round(power * 100)}%`;
}

function setSelected(kind) {
  selected = kind;
  document.querySelectorAll('.tool').forEach(el => el.classList.toggle('active', el.dataset.kind === kind));
}

function showToast(message) {
  ui.toast.textContent = message;
  ui.toast.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => ui.toast.classList.remove('show'), 900);
}

function resetTown() {
  for (const body of bodies) {
    scene.remove(body.mesh);
    body.mesh.geometry.dispose?.();
  }
  bodies.length = 0;
  ui.objectCount.textContent = '0';
  impact = 0;
  ui.impactValue.textContent = '0';
  setSelected(selected);
}

function seedTown() {
  makeBody('crate', new THREE.Vector3(-2.5, 1.4, -3.5), new THREE.Vector3(0, 0, 0));
  makeBody('ball', new THREE.Vector3(2.5, 1.15, 1.3), new THREE.Vector3(0, 0, 0));
  makeBody('barrel', new THREE.Vector3(-1.5, 1.2, 8), new THREE.Vector3(0, 0, 0));
}

const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.1);
const dragState = { active: false, pos: new THREE.Vector3(), start: new THREE.Vector3(), current: new THREE.Vector3() };
let orbiting = false;
let lastPointer = { x: 0, y: 0 };

function screenToGround(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = ((clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
  const point = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, point);
  return point;
}

function launchFromDrag() {
  if (!dragState.active) return;
  const delta = dragState.start.clone().sub(dragState.current);
  const travel = Math.hypot(delta.x, delta.z, delta.y);
  if (travel < 0.35) {
    dragState.active = false;
    return;
  }

  const velocity = new THREE.Vector3(
    delta.x * (2.4 + power * 1.1),
    Math.max(1.2, delta.y * 2.4 + 3.3),
    delta.z * (2.4 + power * 1.1)
  );
  const spawn = dragState.start.clone();
  spawn.x = clamp(spawn.x, -21, 21);
  spawn.z = clamp(spawn.z, -20, 20);
  spawn.y = 1.1;
  const body = makeBody(selected, spawn, velocity);
  body.mesh.position.copy(spawn);
  body.pos.copy(spawn);
  showToast(`${definitions[selected].label} launched`);
  dragState.active = false;
}

canvas.addEventListener('pointerdown', (event) => {
  if (event.button === 2) {
    orbiting = true;
    lastPointer.x = event.clientX;
    lastPointer.y = event.clientY;
    canvas.setPointerCapture(event.pointerId);
    return;
  }

  if (event.button !== 0) return;
  const groundPoint = screenToGround(event.clientX, event.clientY);
  dragState.active = true;
  dragState.start.copy(groundPoint);
  dragState.current.copy(groundPoint);
});

canvas.addEventListener('pointermove', (event) => {
  if (orbiting) {
    const dx = event.clientX - lastPointer.x;
    const dy = event.clientY - lastPointer.y;
    lastPointer.x = event.clientX;
    lastPointer.y = event.clientY;
    azimuth -= dx * 0.005;
    polar = clamp(polar + dy * 0.0035, 0.4, 1.4);
    updateCamera();
    return;
  }

  if (dragState.active) {
    dragState.current.copy(screenToGround(event.clientX, event.clientY));
  }
});

canvas.addEventListener('pointerup', (event) => {
  if (orbiting) {
    orbiting = false;
    canvas.releasePointerCapture(event.pointerId);
    return;
  }
  if (dragState.active) launchFromDrag();
});

canvas.addEventListener('pointerleave', () => {
  if (orbiting) orbiting = false;
  if (dragState.active) launchFromDrag();
});
canvas.addEventListener('contextmenu', (event) => event.preventDefault());

ui.power.addEventListener('input', (event) => {
  power = Number(event.target.value) / 100;
  updatePowerUi();
});

ui.gravityBtn.addEventListener('click', () => {
  gravityOn = !gravityOn;
  ui.gravityBtn.classList.toggle('off', !gravityOn);
});

ui.playBtn.addEventListener('click', () => {
  paused = !paused;
  ui.playText.textContent = paused ? 'SIMULATION PAUSED' : 'SIMULATION LIVE';
  ui.playBtn.querySelector('.live-dot').style.opacity = paused ? '0.4' : '1';
});

ui.resetBtn.addEventListener('click', () => {
  resetTown();
  seedTown();
  showToast('Town reset');
});

ui.zoomIn.addEventListener('click', () => {
  radius = clamp(radius - 3.5, 15, 75);
  updateCamera();
});

ui.zoomOut.addEventListener('click', () => {
  radius = clamp(radius + 3.5, 15, 75);
  updateCamera();
});

ui.homeView.addEventListener('click', () => {
  radius = 40;
  azimuth = Math.PI * 0.25;
  polar = 1.02;
  updateCamera();
});

document.querySelectorAll('.tool').forEach(button => {
  button.addEventListener('click', () => setSelected(button.dataset.kind));
});

document.addEventListener('keydown', (event) => {
  const key = event.key.toLowerCase();
  if (key === '1') setSelected('crate');
  if (key === '2') setSelected('ball');
  if (key === '3') setSelected('barrel');
  if (key === '4') setSelected('rock');
  if (key === 'r') {
    resetTown();
    seedTown();
    showToast('Town reset');
  }
  if (key === ' ') {
    paused = !paused;
    ui.playText.textContent = paused ? 'SIMULATION PAUSED' : 'SIMULATION LIVE';
    ui.playBtn.querySelector('.live-dot').style.opacity = paused ? '0.4' : '1';
  }
});

function updateClock() {
  const now = new Date();
  const minutes = now.getMinutes().toString().padStart(2, '0');
  const hours = now.getHours().toString().padStart(2, '0');
  ui.clock.textContent = `${hours}:${minutes}`;
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(0.033, 1 / 60);
  if (!paused) physics(dt);
  updateCamera();
  renderer.render(scene, camera);
  updateClock();
}

updatePowerUi();
resetTown();
seedTown();
updateClock();
animate();
</script>
</body>
</html>
