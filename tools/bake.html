<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Idle bake tool</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c0b; overflow: hidden; }
  canvas { display: block; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: #cfc8bb; font: 13px ui-monospace, monospace; letter-spacing: .12em; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="status">LOADING…</div>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

const params = new URLSearchParams(location.search)
const sourceName = params.get('source') || 'xbot'
const freeze = params.has('t') ? Number(params.get('t')) : null
const spin = params.get('spin') !== '0'
const statusEl = document.getElementById('status')

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.0
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x131513)
scene.fog = new THREE.FogExp2(0x131513, 0.05)

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 100)
camera.position.set(0, 1.25, 3.6)
camera.lookAt(0, 0.9, 0)

scene.add(new THREE.HemisphereLight(0xaab8c8, 0x14100c, 0.5))
const key = new THREE.DirectionalLight(0xffe1bd, 3.2)
key.position.set(2.5, 4, 3)
key.castShadow = true
key.shadow.mapSize.set(2048, 2048)
key.shadow.camera.near = 0.2
key.shadow.camera.far = 12
key.shadow.camera.left = -2; key.shadow.camera.right = 2
key.shadow.camera.top = 3; key.shadow.camera.bottom = -1
key.shadow.bias = -0.0004
key.shadow.normalBias = 0.02
scene.add(key)
const rim = new THREE.DirectionalLight(0x9db9ff, 1.6)
rim.position.set(-3, 2.6, -3)
scene.add(rim)
const fill = new THREE.DirectionalLight(0xffffff, 0.45)
fill.position.set(-3.5, 1.4, 2.5)
scene.add(fill)

const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x1a1c1a, roughness: 0.7, metalness: 0.2 }))
floor.rotation.x = -Math.PI / 2
floor.receiveShadow = true
scene.add(floor)

const loader = new GLTFLoader()
function load(url) {
  return new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject))
}

function makeBakedClip(targetRoot, sourceRoot, sourceClip, targetHeight, sourceHeight) {
  const targetBones = new Map()
  targetRoot.traverse((o) => { if (o.isBone) targetBones.set(o.name, o) })
  const sourceBones = new Map()
  sourceRoot.traverse((o) => { if (o.isBone) sourceBones.set(o.name, o) })

  const sourceRest = new Map()
  for (const [name, bone] of sourceBones) {
    sourceRest.set(name, { q: bone.quaternion.clone(), p: bone.position.clone() })
  }
  const targetRest = new Map()
  for (const [name, bone] of targetBones) {
    targetRest.set(name, { q: bone.quaternion.clone(), p: bone.position.clone() })
  }

  const mixer = new THREE.AnimationMixer(sourceRoot)
  mixer.clipAction(sourceClip).play()
  mixer.setTime(0)
  sourceRoot.updateMatrixWorld(true)

  const fps = 30
  const frames = Math.max(2, Math.round(sourceClip.duration * fps))
  const duration = frames / fps
  const times = new Float32Array(frames + 1)
  for (let f = 0; f <= frames; f++) times[f] = (f / frames) * duration

  const qScale = 1
  const tracks = []
  const bonesData = {}
  const hipName = 'mixamorig:Hips'
  const scale = targetHeight / sourceHeight
  const matched = []

  for (const [name, targetBone] of targetBones) {
    if (!sourceBones.has(name)) continue
    matched.push(name)
  }

  // Sample source local transforms frame by frame.
  const samples = new Map(matched.map((n) => [n, { r: [], p: [] }]))
  for (let f = 0; f <= frames; f++) {
    const t = f === frames ? 0 : times[f]
    mixer.setTime(t)
    for (const name of matched) {
      const src = sourceBones.get(name)
      const rest = sourceRest.get(name)
      const trest = targetRest.get(name)
      const qDelta = new THREE.Quaternion().copy(rest.q).invert().multiply(src.quaternion)
      const q = trest.q.clone().multiply(qDelta).normalize()
      samples.get(name).r.push(q)
      if (name === hipName) {
        const dp = src.position.clone().sub(rest.p).multiplyScalar(scale)
        samples.get(name).p.push(trest.p.clone().add(dp))
      }
    }
  }

  const round = (v) => Math.round(v * 100000) / 100000
  for (const name of matched) {
    const s = samples.get(name)
    // seamless loop
    s.r[frames].copy(s.r[0])
    if (s.p.length) s.p[frames].copy(s.p[0])
    const rot = new Float32Array((frames + 1) * 4)
    s.r.forEach((q, i) => { rot.set([round(q.x), round(q.y), round(q.z), round(q.w)], i * 4) })
    tracks.push(new THREE.QuaternionKeyframeTrack(`${name}.quaternion`, times, rot))
    const entry = { r: Array.from(rot) }
    if (s.p.length) {
      const pos = new Float32Array((frames + 1) * 3)
      s.p.forEach((p, i) => { pos.set([round(p.x), round(p.y), round(p.z)], i * 3) })
      tracks.push(new THREE.VectorKeyframeTrack(`${name}.position`, times, pos))
      entry.p = Array.from(pos)
    }
    bonesData[name] = entry
  }

  const clip = new THREE.AnimationClip('Idle', duration, tracks)
  return {
    clip,
    json: {
      name: 'Idle',
      source: sourceName,
      fps,
      frames,
      duration,
      height: Number(targetHeight.toFixed(4)),
      bones: bonesData,
    },
  }
}

let spinAngle = 0
let mixer = null
const clock = new THREE.Clock()

async function init() {
  statusEl.textContent = 'LOADING MICHELLE…'
  const [gTarget, gSource] = await Promise.all([
    load('/public/models/michelle.glb'),
    load(`/public/models/${sourceName}.glb`),
  ])

  const targetRoot = gTarget.scene
  const sourceRoot = gSource.scene
  targetRoot.updateMatrixWorld(true)
  sourceRoot.updateMatrixWorld(true)

  const box = new THREE.Box3().setFromObject(targetRoot)
  const targetHeight = box.max.y - box.min.y
  const sbox = new THREE.Box3().setFromObject(sourceRoot)
  const sourceHeight = sbox.max.y - sbox.min.y

  const sourceClip = gSource.animations.find((a) => /idle/i.test(a.name)) || gSource.animations[0]
  statusEl.textContent = `BAKING ${sourceName.toUpperCase()} / ${sourceClip.name}…`

  const { clip, json } = makeBakedClip(targetRoot, sourceRoot, sourceClip, targetHeight, sourceHeight)

  targetRoot.traverse((o) => {
    if (o.isMesh || o.isSkinnedMesh) {
      o.castShadow = true
      o.receiveShadow = true
      o.frustumCulled = false
    }
  })

  // center + ground
  const tb = new THREE.Box3().setFromObject(targetRoot)
  const center = tb.getCenter(new THREE.Vector3())
  targetRoot.position.x -= center.x
  targetRoot.position.z -= center.z
  targetRoot.position.y -= tb.min.y
  scene.add(targetRoot)

  mixer = new THREE.AnimationMixer(targetRoot)
  const action = mixer.clipAction(clip)
  action.setLoop(THREE.LoopRepeat, Infinity)
  action.play()
  if (freeze !== null) {
    mixer.setTime(freeze)
    action.paused = true
  }

  camera.position.set(0.85, Math.max(1.3, targetHeight * 0.75), Math.max(3.2, targetHeight * 2.1))
  camera.lookAt(0, targetHeight * 0.54, 0)

  const payload = JSON.stringify(json)
  const res = await fetch(`/save?name=idle-${sourceName}.json`, { method: 'POST', body: payload })
  const save = await res.json()

  window.__bake = {
    ok: true,
    source: sourceName,
    clip: sourceClip.name,
    duration: clip.duration,
    frames: json.frames,
    bones: Object.keys(json.bones).length,
    height: targetHeight,
    sourceHeight,
    bytes: save.bytes,
    loops: true,
  }
  statusEl.remove()
  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta()
    if (mixer && freeze === null) mixer.update(dt)
    if (spin) {
      spinAngle += dt * 0.22
      const r = Math.hypot(camera.position.x, camera.position.z)
      camera.position.x = Math.sin(spinAngle) * r
      camera.position.z = Math.cos(spinAngle) * r
    }
    camera.lookAt(0, targetHeight * 0.54, 0)
    renderer.render(scene, camera)
  })
}

init().catch((err) => {
  console.error(err)
  statusEl.textContent = 'ERROR: ' + err.message
  window.__bake = { ok: false, error: String(err) }
})

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})
</script>
</body>
</html>
